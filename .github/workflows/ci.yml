name: CI pipeline

on:
  push:
    branches:
      - main
      - feature/CI
  pull_request:
    branches:
      - main

permissions:
  contents: read


jobs:
  backend:
    name: backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: build and test backend
        run: mvn -B verify

  frontend:
    name: frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name : checkout repository
        uses: actions/checkout@v4
      - name: set up Node.js  
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install dependencies 
        run : npm ci 
      - name: test frontend
        run :  npm test   -- --coverage --watchAll=false
      - name : build frontend
        run : npm run build  

