name: CI pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read


jobs:
  backend:
    name: backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: build and test backend
        run: mvn -B verify
      - name: upload backend reports
        if: always()
        uses: actions/upload-artifact@v4 
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/ 

  frontend:
    name: frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name : checkout repository
        uses: actions/checkout@v4
      - name: set up Node.js  
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install dependencies 
        run : npm ci 
      - name: test frontend
        run :  npm test   -- --coverage --watchAll=false
      
      - name : build frontend
        run : npm run build 

      - name: upload frontend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: frontend/coverage/  

  security:
    name: security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: scan dependencies with Trivy
        uses: aquasecurity/trivy-action@0.35.0   
        with:
          scan-type: fs          # scanne les fichiers du repo
          scan-ref: .            # tout le repo (backend + frontend)
          scanners: vuln         # uniquement les vulnérabilités de dépendances
          severity: HIGH,CRITICAL
          ignore-unfixed: true   # ignore les failles sans correctif disponible
          format: table          # lisible dans les logs
          exit-code: '1'         # 0 = ne fait PAS échouer le job  
          trivyignores: .trivyignore  

  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            halimaah/coffee-arabica-backend:latest
            halimaah/coffee-arabica-backend:sha-${{ github.sha }}

      - name: build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            REACT_APP_API_URL=http://localhost:8081
          tags: |
            halimaah/coffee-arabica-frontend:latest
            halimaah/coffee-arabica-frontend:sha-${{ github.sha }}              

