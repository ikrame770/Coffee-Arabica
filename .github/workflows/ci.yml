name: CI pipeline

on:
  push:
    branches:
      - main
      - feature/CI
  pull_request:
    branches:
      - main

permissions:
  contents: read


jobs:
  backend:
    name: backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: build and test backend
        run: mvn -B verify
      - name: upload backend reports
        if: always()
        uses: actions/upload-artifact@v4 
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/ 

  frontend:
    name: frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name : checkout repository
        uses: actions/checkout@v4
      - name: set up Node.js  
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install dependencies 
        run : npm ci 
      - name: test frontend
        run :  npm test   -- --coverage --watchAll=false
      
      - name : build frontend
        run : npm run build 

      - name: upload frontend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: frontend/coverage/  

  security:
    name: security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: scan dependencies with Trivy
        uses: aquasecurity/trivy-action@0.35.0   # voir la note ci-dessous
        with:
          scan-type: fs          # scanne les fichiers du repo
          scan-ref: .            # tout le repo (backend + frontend)
          scanners: vuln         # uniquement les vulnérabilités de dépendances
          severity: HIGH,CRITICAL
          ignore-unfixed: true   # ignore les failles sans correctif disponible
          format: table          # lisible dans les logs
          exit-code: '0'         # 0 = ne fait PAS échouer le job  
          trivyignores: .trivyignore        

